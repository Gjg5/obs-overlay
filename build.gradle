plugins {   插件{
    id 'dev.architectury.loom' version '1.6-SNAPSHOT' apply false“dev.architectury id。loom' version '1.6-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'id ' architecture -plugin' version ‘3.4-SNAPSHOT’
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false“com.github.johnrengelman id。Shadow ' version ‘8.1.1’应用false
}

architectury {
    minecraft = project.minecraft_versionMinecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.

        maven {
            url = "https://api.modrinth.com/maven"
        }
        maven {
            name = "Terraformers"
            url = "https://maven.terraformersmc.com/"
        }
        maven { url "https://maven.shedaniel.me/" }
    }

    dependencies {
    minecraft "net.minecraft:minecraft:$“net.minecraft: minecraft:美元rootProject.minecraft_version"
    mappings loom.layered   分层 {
        // ...
    }
    }
                                 }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.   从components.javajava
            }
        }

        //关于如何设置发布，请参见https://docs.gradle.org/current/userguide/publishing_maven.html。// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.//关于如何设置发布，请参见https://docs.gradle.org/current/userguide/publishing_maven.html。
        repositories {   存储库{
            //添加要发布到这里的存储库。// Add repositories to publish to here.
            //注意：此块与顶层的块具有不同的功能。// Notice: This block does NOT have the same function as the block in the top level.
            //这里的存储库将用于发布您的工件，而不是用于// The repositories here will be used for publishing your artifact, not for
            //检索依赖项。// retrieving dependencies.
        }
    }
}
